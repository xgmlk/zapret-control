name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Previous tags are needed for the Full Changelog link.
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: powershell
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag must look like v1.2.3, got $tag"
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check code-signing secret
        id: signing
        shell: powershell
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
        run: |
          if ($env:PFX_BASE64) { "signed=true" >> $env:GITHUB_OUTPUT }
          else { "signed=false" >> $env:GITHUB_OUTPUT }

      - name: Build signed
        if: steps.signing.outputs.signed == 'true'
        shell: powershell
        env:
          PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          .\build.ps1 -Version '${{ steps.version.outputs.version }}' -Sign -PfxPath $pfx -PfxPassword $env:PFX_PASSWORD
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed: $LASTEXITCODE" }

      - name: Build unsigned (prerelease)
        if: steps.signing.outputs.signed == 'false'
        shell: powershell
        run: |
          Write-Warning 'CODE_SIGN_PFX_BASE64 is not configured; the release will be a prerelease (T2).'
          .\build.ps1 -Version '${{ steps.version.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed: $LASTEXITCODE" }

      - name: Tests
        shell: powershell
        run: |
          .\tests\run-tests.ps1 -NoLive
          if ($LASTEXITCODE -ne 0) { throw "tests failed: $LASTEXITCODE" }

      - name: Release manifest
        shell: powershell
        run: |
          $arguments = @{ Version = '${{ steps.version.outputs.version }}'; Repository = '${{ github.repository }}'; SkipBuild = $true }
          if ('${{ steps.signing.outputs.signed }}' -eq 'true') { $arguments['RequireSignature'] = $true }
          .\release.ps1 @arguments

      - name: Compose release notes
        shell: powershell
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $notesPath = Join-Path $env:GITHUB_WORKSPACE ('.github\release-notes\' + $tag + '.md')
          if (-not (Test-Path -LiteralPath $notesPath)) {
              throw "Missing full changelog: $notesPath. Add it before pushing the tag (see RELEASING.md)."
          }
          $header = [System.IO.File]::ReadAllText(
              (Join-Path $env:GITHUB_WORKSPACE '.github\release-notes-header.md'),
              [System.Text.Encoding]::UTF8)
          $notes = [System.IO.File]::ReadAllText(
              $notesPath, [System.Text.Encoding]::UTF8)
          $previous = ''
          $describe = & git describe --tags --abbrev=0 ($tag + '^') 2>$null
          if ($LASTEXITCODE -eq 0 -and $describe) { $previous = $describe.Trim() }
          $repo = '${{ github.repository }}'
          if ($previous) {
              $compare = "https://github.com/$repo/compare/$previous...$tag"
          } else {
              $compare = "https://github.com/$repo/releases/tag/$tag"
          }
          $body = $header.TrimEnd() + "`r`n`r`n## Что изменилось`r`n`r`n" +
              $notes.TrimEnd() + "`r`n`r`n**Full Changelog**: $compare`r`n"
          $out = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText($out, $body,
              (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Release notes: $out"

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $files = @(
            'dist\ZapretControl.Setup.exe',
            'dist\release.json',
            'dist\SHA256SUMS.txt'
          )
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $arguments = @('release', 'create', $tag) + $files + @(
            '--title', ('Zapret Control ' + $tag),
            '--notes-file', $notesFile
          )
          if ('${{ steps.signing.outputs.signed }}' -eq 'false') {
            $arguments += '--prerelease'
          }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed: $LASTEXITCODE" }
