name: data

on:
  schedule:
    # Every six hours, offset from the top of the hour.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-channel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build signed data
        shell: powershell
        env:
          DATA_SIGN_KEY: ${{ secrets.DATA_SIGN_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'previous-data.json'
          $asset = 'https://github.com/' + $env:GITHUB_REPOSITORY + '/releases/download/data/data.json'
          try {
            Invoke-WebRequest -Uri $asset -OutFile $previous -UseBasicParsing -TimeoutSec 20
          } catch {
            Write-Host 'No release asset yet.'
          }
          if (-not (Test-Path -LiteralPath $previous)) {
            $raw = 'https://raw.githubusercontent.com/' + $env:GITHUB_REPOSITORY + '/data-mirror/data.json'
            try {
              Invoke-WebRequest -Uri $raw -OutFile $previous -UseBasicParsing -TimeoutSec 20
            } catch {
              Write-Host 'No previous data.json; starting at seq 1.'
            }
          }
          $arguments = @{ OutputDirectory = 'dist-data' }
          if (Test-Path -LiteralPath $previous) {
            $arguments['PreviousPath'] = $previous
          }
          & .\tools\build-data.ps1 @arguments

      - name: Publish release asset
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = 'token ' + $env:GH_TOKEN
            'User-Agent' = 'ZapretControl-data/1.0'
            Accept = 'application/vnd.github+json'
          }
          $exists = $true
          try {
            Invoke-RestMethod -Uri ('https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/releases/tags/data') -Headers $headers | Out-Null
          } catch {
            $exists = $false
          }
          $ErrorActionPreference = 'Continue'
          if (-not $exists) {
            gh release create data --repo $env:GITHUB_REPOSITORY --prerelease --title "Data channel" --notes "Signed data channel for ZapretControl. Do not delete."
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          }
          gh release upload data --repo $env:GITHUB_REPOSITORY dist-data/data.json dist-data/data.json.sig --clobber
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }

      - name: Publish mirror branch
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $directory = Join-Path $env:RUNNER_TEMP 'data-branch'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          git -C $directory init -q
          git -C $directory config core.autocrlf false
          git -C $directory config user.name "github-actions[bot]"
          git -C $directory config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $remote = 'https://x-access-token:' + $env:GITHUB_TOKEN + '@github.com/' + $env:GITHUB_REPOSITORY + '.git'
          git -C $directory remote add origin $remote
          git -C $directory fetch --depth=1 origin refs/heads/data-mirror 2>$null
          if ($LASTEXITCODE -eq 0) {
            git -C $directory checkout -q -B data-mirror FETCH_HEAD
          } else {
            git -C $directory checkout -q --orphan data-mirror
          }
          Copy-Item dist-data\data.json (Join-Path $directory 'data.json') -Force
          Copy-Item dist-data\data.json.sig (Join-Path $directory 'data.json.sig') -Force
          Copy-Item dist-data\data-report.txt (Join-Path $directory 'data-report.txt') -Force
          # Signatures cover exact bytes: Git must not rewrite LF/CRLF.
          [System.IO.File]::WriteAllText(
              (Join-Path $directory '.gitattributes'), "* -text`n",
              (New-Object System.Text.UTF8Encoding($false)))
          git -C $directory add .gitattributes data.json data.json.sig data-report.txt
          $seq = (Get-Content dist-data\data-report.txt | Where-Object { $_ -like 'seq=*' } | Select-Object -First 1)
          git -C $directory commit -q -m ("data: " + $seq)
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git -C $directory push origin HEAD:refs/heads/data-mirror --force
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
